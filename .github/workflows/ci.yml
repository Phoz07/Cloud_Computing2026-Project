name: ci

# Checks only — tests against the compose stack, the web build, and every image
# build. NO AWS / EKS interaction: deploy to EKS is a local script
# (scripts/deploy.sh), because GitHub Actions cannot assume a role in the
# Learner Lab account (no OIDC provider, static creds expire in 4h —
# SYSTEM-DESIGN §9). Images are built here to prove the Dockerfiles, not pushed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Every workspace reads the ROOT .env (--env-file=../../.env).
      - name: .env for the compose stack
        run: |
          cp .env.example .env
          sed -i 's/^BETTER_AUTH_SECRET=$/BETTER_AUTH_SECRET=ci-only-insecure-secret-0123456789abcdef/' .env
      - name: start postgres / redis / elasticmq / minio
        run: |
          docker compose up -d
          until docker compose exec -T postgres pg_isready -U postgres; do sleep 1; done
          docker compose wait minio-init || true
      - run: bun install --frozen-lockfile
      - run: bash scripts/lib.test.sh
      - run: bun run db:migrate
      - name: test the packages and services that have a test script
        run: |
          for p in packages/auth-guard packages/storage apps/auth apps/event apps/registration apps/payment; do
            echo "== $p =="
            (cd "$p" && bun run test) || exit 1
          done
      - name: typecheck + build the web
        run: cd apps/web && bun check && bun run build

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [auth, event, registration, payment, mail-worker, web, db-bootstrap]
    steps:
      - uses: actions/checkout@v4
      - name: docker build (no push — see the header)
        run: |
          case "${{ matrix.image }}" in
            db-bootstrap) f=packages/db/Dockerfile ;;
            *) f="apps/${{ matrix.image }}/Dockerfile" ;;
          esac
          docker build -f "$f" -t "eventide/${{ matrix.image }}:ci" .
