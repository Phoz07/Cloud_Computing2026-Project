include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

queues {
  mail-queue {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue {
      name = "mail-dlq"
      maxReceiveCount = 5
    }
  }
  mail-dlq {}
}