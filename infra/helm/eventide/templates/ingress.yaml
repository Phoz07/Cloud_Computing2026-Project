apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventide
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: eventide
  annotations:
    # Multipart uploads go through the services (packages/storage); the default 1m
    # would 413 every cover image.
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.proxyBodySize | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          {{- range $name, $svc := .Values.services }}
          {{- range $svc.ingressPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svc.servicePort | default 80 }}
          {{- end }}
          {{- end }}
      {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
