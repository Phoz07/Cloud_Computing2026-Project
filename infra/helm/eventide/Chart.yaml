apiVersion: v2
name: eventide
description: >-
  The Eventide v2 services (auth, event, registration, payment, mail-worker),
  Redis, the web SPA and the /files -> S3 route — one chart, one release,
  values.local.yaml for k3d and values.aws.yaml for EKS (SYSTEM-DESIGN §12).
  ingress-nginx and the NLB are NOT here — they belong to the cluster lifecycle
  (20-platform / scripts/k3d-up.sh).
type: application
version: 0.2.0
# Application version tracks nothing meaningful — images are pinned per deploy
# via --set, not here.
appVersion: "0.0.0"
